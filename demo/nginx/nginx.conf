# nginx config that runs both under Docker and inside rootless capsule.

# Stay in the foreground: the container's command must be nginx itself, so it
# is PID 1 and its exit status is the container's.
daemon off;

# Rootless capsule maps only your own UID, to root; every other UID is
# unmapped, and the kernel denies setgroups() in that user namespace.
#
# One process, no workers: a worker would switch to an unprivileged user with
# setgid(), initgroups() and setuid(), which fails there.
master_process off;
# nginx still chown()s its temp directories to the configured user, which
# defaults to `nginx` (uid 101). That uid isn't mapped, so chown fails with
# EINVAL. Root is the one mapped user.
user root root;

# Runtime files go on /dev/shm, a fresh tmpfs in every container, not into the
# rootfs. --rootfs is shared and writable: a run as real root (sudo, for bridge
# networking) would leave directories owned by host uid 0 there, and a later
# rootless run can't chown them back, because uid 0 isn't mapped.
pid /dev/shm/nginx.pid;
error_log /dev/stderr info;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /dev/shm/client_body;
    proxy_temp_path /dev/shm/proxy;
    fastcgi_temp_path /dev/shm/fastcgi;
    uwsgi_temp_path /dev/shm/uwsgi;
    scgi_temp_path /dev/shm/scgi;

    sendfile on;

    server {
        # IPv4 only: capsule containers have no IPv6.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
